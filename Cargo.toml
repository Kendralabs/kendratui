[workspace]
resolver = "2"
members = [
    "crates/kendra-models",
    "crates/kendra-config",
    "crates/kendra-http",
    "crates/kendra-context",
    "crates/kendra-history",
    "crates/kendra-tools-core",
    "crates/kendra-tools-impl",
    "crates/kendra-tools-lsp",
    "crates/kendra-tools-symbol",
    "crates/kendra-agents",
    "crates/kendra-web",
    "crates/kendra-repl",
    "crates/kendra-cli",
    "crates/kendra-mcp",
    "crates/kendra-channels",
    "crates/kendra-tui",
    "crates/kendra-runtime",
    "crates/kendra-hooks",
    "crates/kendra-plugins",
    "crates/kendra-sandbox",
]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/opendev-to/opendev"
rust-version = "1.94"

[profile.release]
strip = true
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
strum = { version = "0.28", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures = "0.3"
http-body-util = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# System
libc = "0.2"

# Regex
regex = "1"

# File system
ignore = "0.4"
glob = "0.3"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
dirs-next = "2"

# TypeScript type generation
ts-rs = { version = "10", features = ["serde-json-impl", "chrono-impl"] }

# Testing
tempfile = "3"

# Internal crates
kendra-models = { version = "0.1.6", path = "crates/kendra-models" }
kendra-config = { version = "0.1.6", path = "crates/kendra-config" }
kendra-http = { version = "0.1.6", path = "crates/kendra-http" }
kendra-context = { version = "0.1.6", path = "crates/kendra-context" }
kendra-history = { version = "0.1.6", path = "crates/kendra-history" }
kendra-tools-core = { version = "0.1.6", path = "crates/kendra-tools-core" }
kendra-tools-impl = { version = "0.1.6", path = "crates/kendra-tools-impl" }
kendra-tools-lsp = { version = "0.1.6", path = "crates/kendra-tools-lsp" }
kendra-tools-symbol = { version = "0.1.6", path = "crates/kendra-tools-symbol" }
kendra-agents = { version = "0.1.6", path = "crates/kendra-agents" }
kendra-web = { version = "0.1.6", path = "crates/kendra-web" }
kendra-mcp = { version = "0.1.6", path = "crates/kendra-mcp" }
kendra-channels = { version = "0.1.6", path = "crates/kendra-channels" }
kendra-tui = { version = "0.1.6", path = "crates/kendra-tui" }
kendra-repl = { version = "0.1.6", path = "crates/kendra-repl" }
kendra-cli = { version = "0.1.6", path = "crates/kendra-cli" }
kendra-runtime = { version = "0.1.6", path = "crates/kendra-runtime" }
kendra-hooks = { version = "0.1.6", path = "crates/kendra-hooks" }
kendra-plugins = { version = "0.1.6", path = "crates/kendra-plugins" }
kendra-sandbox = { version = "0.1.6", path = "crates/kendra-sandbox" }
url = "2"
