[package]
name = "kendra-repl"
description = "REPL loop and command handling for KendraCLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kendra-models = { workspace = true }
kendra-config = { workspace = true }
kendra-agents = { workspace = true }
kendra-tools-core = { workspace = true }
kendra-history = { workspace = true }
kendra-runtime = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "rustls"] }
sha2 = "0.10"
dirs = "6"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }

