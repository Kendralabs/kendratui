[package]
name = "kendra-sandbox"
description = "Sandboxed code execution with microsandbox microVMs for KendraCLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
dirs-next = { workspace = true }
which = "7"
kendra-models = { workspace = true }
kendra-http = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
microsandbox = "0.3"
openssl = { version = "0.10.76", features = ["vendored"] }
dbus = { version = "0.9.10", features = ["vendored"] }

[dev-dependencies]
tempfile = { workspace = true }

